server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 server_tokens off;
 client_max_body_size 1m;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
 location /api/ {
  proxy_pass http://server:8080;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_read_timeout 30s;
 }
 location /assets/ { expires 1y; try_files $uri =404; }
 location /images/ { expires 1d; try_files $uri =404; }
 location / { try_files $uri $uri/ /index.html; expires -1; }
}
