name: online-mall-platform
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mall}
      MYSQL_USER: ${MYSQL_USER:-mall}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD required}
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test:
        [
          CMD-SHELL,
          'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql -h 127.0.0.1 -u root -e "SELECT 1"',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    command:
      [
        sh,
        -c,
        'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"',
      ]
    volumes: [redis_data:/data]
    healthcheck:
      test:
        [
          CMD-SHELL,
          'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  server:
    build: { context: ., dockerfile: server/Dockerfile }
    restart: unless-stopped
    environment:
      MYSQL_DSN: "${MYSQL_USER:-mall}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE:-mall}?charset=utf8mb4&parseTime=true&loc=UTC"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD required}
      LISTEN_ADDR: 0.0.0.0:8080
      GIN_MODE: release
      TRUSTED_PROXIES: 172.30.88.0/24
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
  storefront:
    build:
      { context: ., dockerfile: deploy/web.Dockerfile, args: { APP: frontend } }
    restart: unless-stopped
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${STOREFRONT_PORT:-8088}:80"]
    depends_on: { server: { condition: service_healthy } }
  admin:
    build:
      { context: ., dockerfile: deploy/web.Dockerfile, args: { APP: admin } }
    restart: unless-stopped
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${ADMIN_PORT:-8089}:80"]
    depends_on: { server: { condition: service_healthy } }
volumes:
  mysql_data:
  redis_data:

networks:
  default:
    ipam:
      config: [{ subnet: 172.30.88.0/24 }]
